apiVersion: apps/v1
kind: Deployment
metadata:
  name: csr-staging-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: csr-staging-app
  template:
    metadata:
      labels:
        app: csr-staging-app
    spec:
      containers:
        - name: app
          image: casa-sobre-rodas-staging-app:k3s-19cdfd7f65dd
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: csr-staging-env
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
