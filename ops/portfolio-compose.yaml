name: docktools-portfolio

services:
  web:
    image: nginx:stable-alpine
    container_name: docktools-portfolio
    restart: unless-stopped
    user: "101:101"
    read_only: true
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

# Rede compartilhada com o Caddy do docktools-proxy.
networks:
  edge:
    external: true
