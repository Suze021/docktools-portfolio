server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-DockTools-Fallback "active" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /healthz {
    access_log off;
    add_header X-DockTools-Fallback "active" always;
    return 503 "production unavailable\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
