# www é cópia do domínio raiz: consolida num só endereço canônico.
server {
  listen 8080;
  server_name www.docktools.dev;
  return 301 https://docktools.dev$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Página única: caminho inexistente é 404 de verdade, não cópia da home
  # (senão robots.txt/sitemap.xml ausentes viram HTML com status 200).
  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:txt|xml)$ {
    expires 1h;
    try_files $uri =404;
  }

  location ~* \.(?:css|js)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.(?:svg|png|jpg|jpeg|webp|ico|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
